# Analyzes and tests the Dart packages on their own. The runtime's tests run
# in Runner CI, against the built runner.
name: Packages CI

# Only when asked for: from the Actions tab, or
# gh workflow run packages-ci.yml --ref <branch> (#131).
on:
  workflow_dispatch:

# A newer run on the same branch cancels the one it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  raccoon:
    name: raccoon
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/raccoon
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze
      - run: dart test

  raccoon_view:
    name: raccoon_view
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/raccoon_view
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # A macOS app on raccoon_view links with either plugin integration.
  raccoon_view_macos:
    name: raccoon_view macOS host (${{ matrix.plugins }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        plugins: [pods, spm]
    defaults:
      run:
        working-directory: packages/raccoon_view
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: tool/build_host.sh macos ${{ matrix.plugins }}

  # The Linux and Windows halves are compiled only in an app; nothing else
  # builds them.
  raccoon_view_linux:
    name: raccoon_view Linux host
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: packages/raccoon_view
    steps:
      - uses: actions/checkout@v5
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libegl-dev libgles-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: tool/build_host.sh linux

  raccoon_view_windows:
    name: raccoon_view Windows host
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packages/raccoon_view
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: tool/build_host.sh windows
