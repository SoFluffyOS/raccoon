# Builds the runner on each host, bundles the examples, renders a frame, and
# runs raccoon_runtime's tests, whose integration tests drive the built runner.
name: Runner CI

# Only when asked for: from the Actions tab, or
# gh workflow run runner-ci.yml --ref <branch> (#131).
on:
  workflow_dispatch:
    inputs:
      prebuild:
        description: Also prebuild the common plugins (minutes; worth it after changing what they build with)
        type: boolean
        default: false

# A newer run on the same branch cancels the one it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROTOC_VERSION: "21.12"

jobs:
  build:
    name: ${{ matrix.host.name }}, Flutter ${{ matrix.flutter }}
    runs-on: ${{ matrix.host.os }}
    # Jobs take 6-17 min; GitHub's default would let a hung one run 6 h (#333).
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The latest patch of the newest minor, and of the one before it,
        # each with its own engine (#350).
        flutter: ['3.50.0', '3.47.9']
        host:
          - name: linux-x64
            os: ubuntu-latest
            desktop: linux
            target: linux-x64
            sdk-engine: linux-x64
          - name: macos-arm64
            os: macos-latest
            desktop: macos
            target: darwin
            sdk-engine: darwin-x64
          - name: macos-x64
            os: macos-15-intel
            desktop: macos
            target: darwin
            sdk-engine: darwin-x64
          - name: windows-x64
            os: windows-latest
            desktop: windows
            target: windows-x64
            sdk-engine: windows-x64
            exe: .exe
    defaults:
      run:
        working-directory: native/raccoon_runner
        # Git Bash on Windows, as the device helper uses there.
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Install CMake and Ninja
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build ccache libegl1-mesa-dev libgles2-mesa-dev libgtk-3-dev libepoxy-dev libsecret-1-dev libjsoncpp-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Install CMake and Ninja
        if: runner.os == 'macOS'
        run: brew install cmake ninja ccache
      # MSVC on the PATH, and Visual Studio's own CMake and Ninja with it.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Up to ~3 min; once it sat 37 (#333). The SDK and pub cache are kept
      # between runs on Linux and Windows. Not on macOS: four 2 GB SDKs
      # pushed the repo past its 10 GB of caches, so they evicted each other
      # and the engine's, and a miss spent up to 190 s saving 2 GB again; a
      # hit on the Intel Mac took 74-196 s, a download 104-144 s (#409).
      - uses: subosito/flutter-action@v2
        timeout-minutes: 15
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
          cache: ${{ runner.os != 'macOS' }}

      - name: Cache the engine and protoc
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/raccoon
            ~/.local/raccoon/protoc
          key: raccoon-${{ matrix.host.name }}-flutter-${{ matrix.flutter }}-protoc-${{ env.PROTOC_VERSION }}

      - name: Precache the desktop artifacts, for the ICU data
        run: flutter precache --${{ matrix.host.desktop }}

      # On Windows the Dart side reads these too, so they are written C:/...
      - name: Locate the engine and the ICU data
        run: |
          SDK="$(cd "$(dirname "$(readlink -f "$(command -v flutter)")")/.." && pwd)"
          ICU="$SDK/bin/cache/artifacts/engine/${{ matrix.host.sdk-engine }}/icudtl.dat"
          if command -v cygpath >/dev/null; then ICU="$(cygpath -m "$ICU")"; fi
          # Its own line: a failed download inside the echo would pass the
          # step and fail at Configure, saying something else.
          ENGINE_DIR="$(tool/engine_dir.sh)"
          echo "RACCOON_ENGINE_DIR=$ENGINE_DIR" >> "$GITHUB_ENV"
          echo "RACCOON_ICU=$ICU" >> "$GITHUB_ENV"

      # protobuf is built from source, 118 of the Intel Mac's 166 build
      # steps, the same every run (#409). The objects are kept by the
      # runner's sources; a change starts from the last ones. Not on
      # Windows: MSVC writes debug info with /Zi, which ccache can't keep.
      - name: Cache the compiled objects
        if: runner.os != 'Windows'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.host.name }}-flutter-${{ matrix.flutter }}-${{ hashFiles('native/raccoon_runner/CMakeLists.txt', 'native/raccoon_runner/src/**', 'native/raccoon_runner/test/**', 'native/raccoon_runner/proto/**', 'native/raccoon_runner/third_party/**') }}
          restore-keys: ccache-${{ matrix.host.name }}-flutter-${{ matrix.flutter }}-

      - name: Install protoc
        run: tool/protoc.sh
      # Only the runner's own build goes through ccache, not the plugins the
      # tests build. The compiler is told apart by its version, not its
      # path: on macOS that is a shim, whatever Xcode is behind it.
      - name: Configure
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: |
          launch=()
          if [ "$RUNNER_OS" != Windows ]; then
            ccache --zero-stats
            launch=(-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
            if [ "$RUNNER_OS" = macOS ]; then
              launch+=(-DCMAKE_OBJC_COMPILER_LAUNCHER=ccache -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache)
            fi
          fi
          cmake -S . -B build -G Ninja -DRACCOON_ENGINE_DIR="$RACCOON_ENGINE_DIR" "${launch[@]}"
      - name: Build
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
          CCACHE_COMPILERCHECK: '%compiler% --version'
        run: |
          ninja -C build
          if [ "$RUNNER_OS" != Windows ]; then ccache --show-stats; fi
      - name: Version
        run: build/raccoon_runner --version
      # Flutter's device ping, by the absolute path setup writes (C:/... on
      # Windows): there it finds the runner only once the helper knows it
      # runs in Git Bash.
      - name: Ping the device helper
        run: |
          "$PWD/tool/raccoon-device" ping
          if [ "$RUNNER_OS" = Windows ]; then
            "$(cygpath -m "$PWD")/tool/raccoon-device" ping
          fi

      # Side by side: each is its own project, and the bundles come out
      # byte for byte as they do one after another; on four cores 34 s
      # became 15 (#409). Each one's output is shown whole, in turn.
      - name: Build the example bundles
        run: |
          examples="hello spin channels camera text views plugins_app plugins_modal plugins_static no_plugin no_plugin_late"
          mkdir -p build/bundle-logs
          pids=""
          for example in $examples; do
            (cd "example/$example" && flutter build bundle --target-platform=${{ matrix.host.target }}) \
              > "build/bundle-logs/$example.log" 2>&1 &
            pids="$pids $!"
          done
          set -- $pids
          failed=""
          for example in $examples; do
            if wait "$1"; then status=ok; else status=failed; failed="$failed $example"; fi
            shift
            echo "::group::example/$example: $status"
            cat "build/bundle-logs/$example.log"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::bundles failed:$failed"
            exit 1
          fi

      # A code asset from a build hook (#53, #57); its C exports nothing for
      # a Windows DLL.
      - name: Build the native assets example
        if: runner.os != 'Windows'
        working-directory: native/raccoon_runner/example/native_assets_app
        run: flutter build bundle --target-platform=${{ matrix.host.target }}

      # Libraries on Linux, frameworks on macOS: every plugin, or it fails.
      # No native plugins on Windows yet (#36). Minutes (six on macOS x64),
      # and it only checks that the release's plugins still build, so only
      # when asked for; the release workflow always does it.
      - name: Prebuild the common plugins
        if: runner.os != 'Windows' && inputs.prebuild
        env:
          RACCOON_PREBUILD_ALL: '1'
        run: tool/raccoon-device prebuild tool/plugins build/plugins-test.tar.gz && tar tzf build/plugins-test.tar.gz | grep -c -E '\.so$|\.framework/$'

      - name: Render a frame of example/hello
        run: |
          build/raccoon_runner render \
            --engine-dir "$RACCOON_ENGINE_DIR" \
            --assets example/hello/build/flutter_assets \
            --icu "$RACCOON_ICU" \
            --out build/frame.ppm
          test -s build/frame.ppm

      # A path the ANSI code page can't spell: on Windows the runner takes
      # its arguments as UTF-8, as the engine reads them (#126).
      - name: Render example/hello from a non-ASCII path
        run: |
          dir="build/José 猫"
          mkdir -p "$dir"
          cp -R example/hello/build/flutter_assets "$dir/"
          build/raccoon_runner render \
            --engine-dir "$RACCOON_ENGINE_DIR" \
            --assets "$dir/flutter_assets" \
            --icu "$RACCOON_ICU" \
            --out "$dir/frame.ppm"
          test -s "$dir/frame.ppm"

      # Views mode (#182): one engine, a view beside the first, each written.
      - name: Render example/views in two views
        run: |
          build/raccoon_runner render \
            --engine-dir "$RACCOON_ENGINE_DIR" \
            --assets example/views/build/flutter_assets \
            --icu "$RACCOON_ICU" \
            --view 300x200@2 \
            --out build/views.ppm
          test -s build/views.ppm && test -s build/views.view1.ppm

      - name: Resolve the runtime
        working-directory: packages/raccoon_runtime
        run: dart pub get

      # Linux and Windows run the files side by side, as dart test does (two
      # at a time on four cores), then the ones tagged timing one file at a
      # time: they bound frame rates and waits, or starve a GPU ring, when
      # something beside them holds the machine up. The Macs run one file at
      # a time: pod and Swift package builds are most of their suite, and
      # #383's tests fail on the Intel Mac with nothing beside them (#413).
      - name: Run the runtime's tests against the runner
        working-directory: packages/raccoon_runtime
        env:
          RACCOON_RUNNER: ${{ github.workspace }}/native/raccoon_runner/build/raccoon_runner${{ matrix.host.exe }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            dart test --reporter expanded --concurrency=1
          else
            status=0
            dart test --reporter expanded --exclude-tags timing || status=$?
            dart test --reporter expanded --tags timing --concurrency=1 || status=$?
            exit "$status"
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: raccoon_runner-${{ matrix.host.name }}-flutter-${{ matrix.flutter }}
          path: native/raccoon_runner/build/raccoon_runner${{ matrix.host.exe }}
