# Builds the runner on each host, bundles the examples, renders a frame, and
# runs raccoon_runtime's tests, whose integration tests drive the built runner.
name: Runner CI

# Only when asked for: from the Actions tab, or
# gh workflow run runner-ci.yml --ref <branch> (#131).
on:
  workflow_dispatch:
    inputs:
      prebuild:
        description: Also prebuild the common plugins (minutes; worth it after changing what they build with)
        type: boolean
        default: false

# A newer run on the same branch cancels the one it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7
  PROTOC_VERSION: "21.12"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            desktop: linux
            target: linux-x64
            sdk-engine: linux-x64
          - name: macos-arm64
            os: macos-latest
            desktop: macos
            target: darwin
            sdk-engine: darwin-x64
          - name: macos-x64
            os: macos-15-intel
            desktop: macos
            target: darwin
            sdk-engine: darwin-x64
          - name: windows-x64
            os: windows-latest
            desktop: windows
            target: windows-x64
            sdk-engine: windows-x64
            exe: .exe
    defaults:
      run:
        working-directory: native/raccoon_runner
        # Git Bash on Windows, as the device helper uses there.
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Install CMake and Ninja
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libegl1-mesa-dev libgles2-mesa-dev libgtk-3-dev libepoxy-dev libsecret-1-dev libjsoncpp-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Install CMake and Ninja
        if: runner.os == 'macOS'
        run: brew install cmake ninja
      # MSVC on the PATH, and Visual Studio's own CMake and Ninja with it.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # cache: true keeps the SDK and the pub cache between runs.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache the engine and protoc
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/raccoon
            ~/.local/raccoon/protoc
          key: raccoon-${{ matrix.name }}-flutter-${{ env.FLUTTER_VERSION }}-protoc-${{ env.PROTOC_VERSION }}

      - name: Precache the desktop artifacts, for the ICU data
        run: flutter precache --${{ matrix.desktop }}

      # On Windows the Dart side reads these too, so they are written C:/...
      - name: Locate the engine and the ICU data
        run: |
          SDK="$(cd "$(dirname "$(readlink -f "$(command -v flutter)")")/.." && pwd)"
          ICU="$SDK/bin/cache/artifacts/engine/${{ matrix.sdk-engine }}/icudtl.dat"
          if command -v cygpath >/dev/null; then ICU="$(cygpath -m "$ICU")"; fi
          echo "RACCOON_ENGINE_DIR=$(tool/engine_dir.sh)" >> "$GITHUB_ENV"
          echo "RACCOON_ICU=$ICU" >> "$GITHUB_ENV"

      - name: Install protoc
        run: tool/protoc.sh
      - name: Configure
        run: cmake -S . -B build -G Ninja -DRACCOON_ENGINE_DIR="$RACCOON_ENGINE_DIR"
      - name: Build
        run: ninja -C build
      - name: Version
        run: build/raccoon_runner --version

      - name: Build the example bundles
        run: |
          for example in hello spin channels camera plugins_app plugins_modal no_plugin no_plugin_late; do
            (cd "example/$example" && flutter build bundle --target-platform=${{ matrix.target }})
          done

      # A code asset from a build hook (#53, #57); its C exports nothing for
      # a Windows DLL.
      - name: Build the native assets example
        if: runner.os != 'Windows'
        working-directory: native/raccoon_runner/example/native_assets_app
        run: flutter build bundle --target-platform=${{ matrix.target }}

      # Libraries on Linux, frameworks on macOS: at least one, or it fails.
      # No native plugins on Windows yet (#36). Minutes (six on macOS x64),
      # and it only checks that the release's plugins still build, so only
      # when asked for; the release workflow always does it.
      - name: Prebuild the common plugins
        if: runner.os != 'Windows' && inputs.prebuild
        run: tool/raccoon-device prebuild tool/plugins build/plugins-test.tar.gz && tar tzf build/plugins-test.tar.gz | grep -c -E '\.so$|\.framework/$'

      - name: Render a frame of example/hello
        run: |
          build/raccoon_runner render \
            --engine-dir "$RACCOON_ENGINE_DIR" \
            --assets example/hello/build/flutter_assets \
            --icu "$RACCOON_ICU" \
            --out build/frame.ppm
          test -s build/frame.ppm

      - name: Resolve the runtime
        working-directory: packages/raccoon_runtime
        run: dart pub get

      - name: Run the runtime's tests against the runner
        working-directory: packages/raccoon_runtime
        env:
          RACCOON_RUNNER: ${{ github.workspace }}/native/raccoon_runner/build/raccoon_runner${{ matrix.exe }}
        run: dart test --reporter expanded

      - uses: actions/upload-artifact@v6
        with:
          name: raccoon_runner-${{ matrix.name }}
          path: native/raccoon_runner/build/raccoon_runner${{ matrix.exe }}
