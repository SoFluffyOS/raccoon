# Builds the runner on each host and packages it (tool/package.sh). A tag
# runner-v<VERSION> publishes the archives as a GitHub release, a prerelease
# when VERSION carries a -pre.N suffix; workflow_dispatch only keeps them as
# workflow artifacts, to check the packaging. Plain v* tags are the raccoon
# package's.
name: Runner release

on:
  push:
    tags: ['runner-v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.7
  # Other Flutter versions people are on, each its own engine: on macOS the
  # common plugins are prebuilt for these too, an archive each (#211).
  MORE_FLUTTER_VERSIONS: "3.47.8 3.44.9"
  PROTOC_VERSION: "21.12"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest image: the binary, the engine and the plugins need
          # this glibc or later, not the newest one's.
          - name: linux-x64
            os: ubuntu-22.04
          - name: macos-arm64
            os: macos-latest
          - name: macos-x64
            os: macos-15-intel
          - name: windows-x64
            os: windows-latest
    defaults:
      run:
        working-directory: native/raccoon_runner
        # Git Bash on Windows.
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: The tag must match VERSION
        if: github.ref_type == 'tag'
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "runner-v$VERSION" != "${{ github.ref_name }}" ]; then
            echo "VERSION says $VERSION but the tag is ${{ github.ref_name }}" >&2
            exit 1
          fi

      # The 22.04 image ships libunwind-14-dev, which keeps GStreamer's
      # libunwind-dev from installing; it goes first.
      - name: Install CMake and Ninja
        if: runner.os == 'Linux'
        run: sudo apt-get update && (sudo apt-get remove -y libunwind-14-dev || true) && sudo apt-get install -y cmake ninja-build libegl1-mesa-dev libgles2-mesa-dev libgtk-3-dev libepoxy-dev libsecret-1-dev libjsoncpp-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Install CMake and Ninja
        if: runner.os == 'macOS'
        run: brew install cmake ninja
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache the engine and protoc
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/raccoon
            ~/.local/raccoon/protoc
          key: raccoon-${{ matrix.name }}-flutter-${{ env.FLUTTER_VERSION }}-protoc-${{ env.PROTOC_VERSION }}

      - name: Install protoc
        run: tool/protoc.sh
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRACCOON_ENGINE_DIR="$(tool/engine_dir.sh)"
      - name: Build
        run: ninja -C build
      - name: Version
        run: build/raccoon_runner --version

      - name: Package
        run: tool/package.sh dist
      # FlutterMacOS, which the macOS plugin pods build against.
      - name: Precache the macOS artifacts
        if: runner.os == 'macOS'
        run: flutter precache --macos
      # The common plugins, built against this archive's library (Linux) or
      # the SDK's FlutterMacOS (macOS), in the cache's layout: an install
      # fetches it once and copies.
      # No native plugins on Windows yet (#36).
      - name: Prebuild the common plugins
        if: runner.os != 'Windows'
        run: |
          ENGINE="$(basename "$(dirname "$(tool/engine_dir.sh)")")"
          case "$(uname -s)" in
            Darwin) HOST=macos ;;
            *) HOST=linux ;;
          esac
          archive="dist/plugins-$ENGINE-$HOST-$(uname -m).tar.gz"
          tool/raccoon-device prebuild tool/plugins "$archive"
          # A prebuild whose plugins failed exits 0; a release without them
          # would be remembered as having none (#149). At least one library
          # or framework, or the release fails.
          tar tzf "$archive" | grep -c -E '\.so$|\.framework/$'
      # The same for the other Flutter versions, against each one's own
      # FlutterMacOS. One that fails is a warning: the release goes on
      # without its archive, and an install there builds its plugins.
      - name: Prebuild the common plugins for other Flutter versions
        if: runner.os == 'macOS'
        run: |
          for version in $MORE_FLUTTER_VERSIONS; do
            sdk="$RUNNER_TEMP/flutter-$version"
            if ! git clone --quiet --depth 1 --branch "$version" https://github.com/flutter/flutter.git "$sdk" ||
               ! "$sdk/bin/flutter" precache --macos > /dev/null; then
              echo "::warning::no Flutter $version"
              continue
            fi
            engine="$(tr -d '[:space:]' < "$sdk/bin/cache/engine.stamp")"
            archive="dist/plugins-$engine-macos-$(uname -m).tar.gz"
            [ -f "$archive" ] && continue
            FLUTTER_ROOT="$sdk" PATH="$sdk/bin:$PATH" tool/raccoon-device prebuild tool/plugins "$archive" ||
              echo "::warning::prebuild for Flutter $version failed"
            frameworks="$(tar tzf "$archive" 2> /dev/null | grep -c -E '\.framework/$' || true)"
            if [ "${frameworks:-0}" -eq 0 ]; then
              echo "::warning::no plugins prebuilt for Flutter $version"
              rm -f "$archive"
            fi
          done

      - uses: actions/upload-artifact@v6
        with:
          name: raccoon_runner-${{ matrix.name }}
          path: native/raccoon_runner/dist/*.tar.gz

  release:
    # Only a pushed tag publishes: run by hand, even on a tag, the archives
    # stay workflow artifacts.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(tr -d '[:space:]' < native/raccoon_runner/VERSION)"
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          ls -l dist
          cat > notes.md <<NOTES
          Prebuilt \`raccoon_runner\` $VERSION for Linux x64, macOS arm64, macOS x64 and Windows x64. Each archive holds the binary, \`tool/raccoon-device\` with its scripts (\`engine_dir.sh\`, \`package_scope.dart\`, \`plugins_windows.dart\`), \`VERSION\` and \`LICENSE\`, and works as a runtime on its own once unpacked (on Windows the helper runs in Git Bash):

              mkdir raccoon_runner && tar xzf raccoon_runner-$VERSION-<platform>.tar.gz -C raccoon_runner
              raccoon_runner/raccoon_runner --version

          A browser download on macOS needs \`xattr -d com.apple.quarantine raccoon_runner/raccoon_runner\` before Gatekeeper lets it run. The Raccoon Simulator downloads the archive for its host itself.
          NOTES
          case "$VERSION" in
            *-*) flags=(--prerelease --title "raccoon_runner $VERSION (prerelease)") ;;
            *) flags=(--title "raccoon_runner $VERSION") ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* "${flags[@]}" --notes-file notes.md --generate-notes
          fi
