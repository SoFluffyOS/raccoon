name: raccoon_view
description: Flutter widgets that show a Raccoon-hosted app inside Lumide.
publish_to: "none"

environment:
  sdk: ^3.6.0


dependencies:
  fixnum: ^1.1.0
  flutter:
    sdk: flutter
  raccoon:
    path: ../raccoon
  raccoon_runtime:
    path: ../raccoon_runtime
  url_launcher: ^6.3.0

flutter:
  plugin:
    platforms:
      linux:
        pluginClass: RaccoonViewPlugin
      macos:
        pluginClass: RaccoonViewPlugin

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
