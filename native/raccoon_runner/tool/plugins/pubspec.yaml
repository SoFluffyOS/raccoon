name: raccoon_prebuilt_plugins
description: The common native plugins the release prebuilds for Linux (see tool/raccoon-device prebuild). Not an app; its resolved packages are what gets built.
publish_to: "none"

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  app_links: ^6.4.0
  audioplayers: ^6.5.0
  battery_plus: ^6.2.1
  connectivity_plus: ^6.1.4
  device_info_plus: ^11.5.0
  file_selector: ^1.0.3
  flutter_local_notifications: ^19.4.0
  flutter_secure_storage: ^9.2.4
  geolocator: ^14.0.2
  image_picker: ^1.2.0
  open_file: ^3.5.10
  package_info_plus: ^8.3.0
  record: ^6.1.1
  share_plus: ^11.1.0
  url_launcher: ^6.3.2
  wakelock_plus: ^1.3.2
