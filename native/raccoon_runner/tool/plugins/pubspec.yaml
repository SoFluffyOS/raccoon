name: raccoon_prebuilt_plugins
description: The common native plugins the release prebuilds for Linux (see tool/raccoon-device prebuild). Not an app; its resolved packages are what gets built.
publish_to: "none"

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  app_links: ^7.2.2
  audioplayers: ^6.5.0
  battery_plus: ^7.1.2
  connectivity_plus: ^6.1.4
  device_info_plus: ^13.3.0
  file_selector: ^1.0.3
  flutter_local_notifications: ^23.0.2
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.0.2
  image_picker: ^1.2.0
  open_file: ^4.0.0
  package_info_plus: ^10.2.2
  record: ^7.2.0
  share_plus: ^13.3.1
  # The last that is a plugin: 0.6 is end of life, sqlite3 3.x builds its
  # library through a hook.
  sqlite3_flutter_libs: ^0.5.42
  super_native_extensions: ^0.9.1
  url_launcher: ^6.3.2
  wakelock_plus: ^1.3.2

dependency_overrides:
  # super_native_extensions 0.9.1 wants device_info_plus <12. The prebuild
  # compiles only native code, so the Mac archives keep 13; an app with
  # super_clipboard resolves 11, Dart only on Linux.
  device_info_plus: ^13.3.0
