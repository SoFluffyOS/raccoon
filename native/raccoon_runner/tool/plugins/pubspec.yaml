name: raccoon_prebuilt_plugins
description: The common native plugins the release prebuilds for Linux (see tool/raccoon-device prebuild). Not an app; its resolved packages are what gets built.
publish_to: "none"

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  app_links: ^7.2.2
  audioplayers: ^6.5.0
  battery_plus: ^7.1.2
  connectivity_plus: ^7.3.1
  device_info_plus: ^13.3.0
  file_selector: ^1.0.3
  flutter_local_notifications: ^23.0.2
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.0.2
  image_picker: ^1.2.0
  open_file: ^4.0.0
  package_info_plus: ^10.2.2
  record: ^7.2.0
  share_plus: ^13.3.1
  url_launcher: ^6.3.2
  wakelock_plus: ^1.3.2
