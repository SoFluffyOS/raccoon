name: raccoon_echo
description: A native Linux, macOS and Windows plugin with one method, echo, answered from GLib's main loop, the main queue or the platform thread's messages, and a texture. The runner's test plugin - loaded, not built in.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.6.0
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      linux:
        pluginClass: RaccoonEchoPlugin
      macos:
        pluginClass: RaccoonEchoPlugin
      windows:
        pluginClass: RaccoonEchoPlugin
