name: raccoon_echo
description: A native Linux plugin with one method, echo, answered from a GLib idle callback. The runner's test plugin - loaded, not built in.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.6.0
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      linux:
        pluginClass: RaccoonEchoPlugin
